[package]
name = "rusthunter"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cfg-if = "1.0"
clap = { version = "4.5", features = ["derive"] }
configparser = "3.1"
serde_json = "1.0"
assert-json-diff = "2.0"
diffy = "0.4"
hostname = "0.4"
maplit = "1.0"
colored = "3.0"
glob = "0.3"
chrono = "0.4"
powershell_script = "1.0"
regex = "1.12"

[dev-dependencies]
tempfile = "3.14"