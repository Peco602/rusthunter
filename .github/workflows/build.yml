name: Build

on:
  push:
    branches:
      - main
      - dev
            
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Execution permissions
      run: chmod +x ./rusthunter.sh
      
    - name: Build
      run: sudo ./rusthunter.sh build