name: Windows

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      working-directory: ${{github.workspace}}\app
      run: cargo build --verbose

    - name: Unit and Integration Tests
      working-directory: ${{github.workspace}}\app
      run: cargo test --verbose

